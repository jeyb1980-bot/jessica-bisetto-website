<!doctype html>
<!-- @dsCard group="Colors" name="Audience Accents" subtitle="Kinder · Erwachsene · Unternehmen" viewport="700x220" --><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:28px 32px;background:var(--bg)}

  <div class="card" style="background:#EEF1EA"><div><div class="eb" style="color:#586951"><span class="dot" style="background:#7C9070"></span>Unternehmen</div><div class="label" style="color:#586951">Gemeinsam tragen.</div></div><div class="foot" style="color:#586951">sage · #7C9070 / bg #EEF1EA</div></div>
</div>
</body></html>
