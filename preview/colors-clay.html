<!doctype html>
<!-- @dsCard group="Colors" name="Clay Scale" subtitle="Secondary — warmth, humanity" viewport="700x210" --><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:28px 32px;background:var(--bg)}
.title{font-family:var(--font-body);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-clay-700);margin-bottom:14px}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.sw{aspect-ratio:1;border-radius:var(--r-md);position:relative;overflow:hidden;border:1px solid rgba(31,27,22,.05)}
.sw>span{position:absolute;left:8px;bottom:6px;right:8px;font-family:var(--font-body);font-size:10px}
.dark span{color:#FAF6F0}.light span{color:#1F1B16}
.k{display:block;font-size:9px;opacity:.75}
</style></head><body>
<div class="title">Clay · warmth, humanity, terracotta</div>
<div class="row">
  <div class="sw light" style="background:#FBEFE7"><span><b>50</b><span class="k">#FBEFE7</span></span></div>
  <div class="sw light" style="background:#F4D9C5"><span><b>100</b><span class="k">#F4D9C5</span></span></div>
  <div class="sw light" style="background:#E0A582"><span><b>300</b><span class="k">#E0A582</span></span></div>
  <div class="sw dark"  style="background:#C77F5C"><span><b>500</b><span class="k">#C77F5C</span></span></div>
  <div class="sw dark"  style="background:#9E5E40"><span><b>700</b><span class="k">#9E5E40</span></span></div>
  <div class="sw dark"  style="background:#6E3E27"><span><b>900</b><span class="k">#6E3E27</span></span></div>
</div>
</body></html>
