<!doctype html>
<!-- @dsCard group="Colors" name="Neutrals" subtitle="Bone → Ink, warm paper neutrals" viewport="700x180" --><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:28px 32px;background:var(--bg)}
.row{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.sw{aspect-ratio:1;border-radius:var(--r-md);border:1px solid rgba(31,27,22,.06);position:relative;overflow:hidden}
.sw>span{position:absolute;left:8px;bottom:6px;right:8px;font-family:var(--font-body);font-size:10px;letter-spacing:.04em}
.dark span{color:var(--color-bone)}
.light span{color:var(--color-ink)}
.k{display:block;font-size:9px;opacity:.7;letter-spacing:.06em;text-transform:uppercase}
</style></head><body>
<div class="row">
  <div class="sw light" style="background:#FAF6F0"><span><b>Bone</b><span class="k">#FAF6F0</span></span></div>
  <div class="sw light" style="background:#F2EBDE"><span><b>Cream</b><span class="k">#F2EBDE</span></span></div>
  <div class="sw light" style="background:#E4D9C6"><span><b>Sand</b><span class="k">#E4D9C6</span></span></div>
  <div class="sw light" style="background:#C9BFAE"><span><b>Stone 300</b><span class="k">#C9BFAE</span></span></div>
  <div class="sw dark" style="background:#8C8273"><span><b>Stone 500</b><span class="k">#8C8273</span></span></div>
  <div class="sw dark" style="background:#5A5247"><span><b>Stone 700</b><span class="k">#5A5247</span></span></div>
  <div class="sw dark" style="background:#1F1B16"><span><b>Ink</b><span class="k">#1F1B16</span></span></div>
</div>
</body></html>
