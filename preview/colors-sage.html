<!doctype html>
<!-- @dsCard group="Colors" name="Sage Scale" subtitle="Tertiary — growth, balance" viewport="700x210" --><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:28px 32px;background:var(--bg)}
.title{font-family:var(--font-body);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-sage-700);margin-bottom:14px}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.sw{aspect-ratio:1;border-radius:var(--r-md);position:relative;overflow:hidden;border:1px solid rgba(31,27,22,.05)}
.sw>span{position:absolute;left:8px;bottom:6px;right:8px;font-family:var(--font-body);font-size:10px}
.dark span{color:#FAF6F0}.light span{color:#1F1B16}
.k{display:block;font-size:9px;opacity:.75}
</style></head><body>
<div class="title">Sage · growth, balance, nature</div>
<div class="row">
  <div class="sw light" style="background:#EEF1EA"><span><b>50</b><span class="k">#EEF1EA</span></span></div>
  <div class="sw light" style="background:#D7DECB"><span><b>100</b><span class="k">#D7DECB</span></span></div>
  <div class="sw light" style="background:#A8B596"><span><b>300</b><span class="k">#A8B596</span></span></div>
  <div class="sw dark"  style="background:#7C9070"><span><b>500</b><span class="k">#7C9070</span></span></div>
  <div class="sw dark"  style="background:#586951"><span><b>700</b><span class="k">#586951</span></span></div>
  <div class="sw dark"  style="background:#364232"><span><b>900</b><span class="k">#364232</span></span></div>
</div>
</body></html>
