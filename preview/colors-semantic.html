<!doctype html>
<!-- @dsCard group="Colors" name="Semantic Colors" subtitle="Success / Warning / Danger / Info / Focus" viewport="700x160" --><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:28px 32px;background:var(--bg)}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.chip{border-radius:var(--r-md);padding:14px 14px 10px;color:var(--color-bone);font-family:var(--font-body)}
.chip b{display:block;font-size:13px;letter-spacing:.04em;font-weight:600}
.chip span{display:block;font-size:10px;letter-spacing:.06em;opacity:.85;margin-top:8px}
</style></head><body>
<div class="row">
  <div class="chip" style="background:#6F8869"><b>Success</b><span>#6F8869</span></div>
  <div class="chip" style="background:#C99650"><b>Warning</b><span>#C99650</span></div>
  <div class="chip" style="background:#B5604E"><b>Danger</b><span>#B5604E</span></div>
  <div class="chip" style="background:#5C8585"><b>Info</b><span>#5C8585</span></div>
  <div class="chip" style="background:#FAF6F0;color:#2A5557;border:2px solid #2A5557;box-shadow:0 0 0 3px #C5D4D2"><b>Focus</b><span>2px / +3px ring</span></div>
</div>
</body></html>
