<!doctype html>
<!-- @dsCard group="Colors" name="Teal Scale" subtitle="Primary — trust, depth" viewport="700x210" --><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:28px 32px;background:var(--bg)}
.title{font-family:var(--font-body);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-teal-700);margin-bottom:14px}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.sw{aspect-ratio:1;border-radius:var(--r-md);position:relative;overflow:hidden;border:1px solid rgba(31,27,22,.05)}
.sw>span{position:absolute;left:8px;bottom:6px;right:8px;font-family:var(--font-body);font-size:10px;letter-spacing:.04em}
.dark span{color:#FAF6F0}.light span{color:#1F1B16}
.k{display:block;font-size:9px;opacity:.75}
</style></head><body>
<div class="title">Teal · trust, depth, still water</div>
<div class="row">
  <div class="sw light" style="background:#E6EDEC"><span><b>50</b><span class="k">#E6EDEC</span></span></div>
  <div class="sw light" style="background:#C5D4D2"><span><b>100</b><span class="k">#C5D4D2</span></span></div>
  <div class="sw light" style="background:#7AA0A0"><span><b>300</b><span class="k">#7AA0A0</span></span></div>
  <div class="sw dark"  style="background:#3D7373"><span><b>500</b><span class="k">#3D7373</span></span></div>
  <div class="sw dark"  style="background:#2A5557"><span><b>700</b><span class="k">#2A5557</span></span></div>
  <div class="sw dark"  style="background:#173738"><span><b>900</b><span class="k">#173738</span></span></div>
</div>
</body></html>
