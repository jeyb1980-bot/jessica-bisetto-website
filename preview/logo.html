<!doctype html>
<!-- @dsCard group="Brand" name="Logo Usage" subtitle="Lockup, mark, inverted" viewport="700x180" --><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:28px 32px;background:var(--bg);display:flex;align-items:center;gap:36px}
.lockup{display:flex;align-items:center;gap:14px}
.lockup img{width:54px;height:54px}
.lockup .wm{font-family:var(--font-display);font-weight:400;font-size:30px;letter-spacing:-.01em;color:var(--fg)}
.mark-only{padding:14px;background:var(--color-ink);border-radius:var(--r-md)}
.mark-only img{width:48px;height:48px;filter:invert(1)}
.tag{font-family:var(--font-body);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-subtle);margin-top:8px;text-align:center}
.stack{display:flex;flex-direction:column;align-items:center;gap:0}
</style></head><body>
<div class="stack">
  <div class="lockup"><img src="../assets/logo.png" alt=""><span class="wm">Jessica Bisetto</span></div>
  <div class="tag">Lockup · primary</div>
</div>
<div class="stack">
  <img src="../assets/logo.png" style="width:54px;height:54px">
  <div class="tag">Mark only</div>
</div>
<div class="stack">
  <div class="mark-only"><img src="../assets/logo.png"></div>
  <div class="tag">On dark · inverted</div>
</div>
</body></html>
