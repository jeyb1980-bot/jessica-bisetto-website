<!doctype html>
<!-- @dsCard group="Spacing" name="Radii" subtitle="xs → pill" viewport="700x200" --><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:28px 32px;background:var(--bg)}
.row{display:flex;gap:18px;align-items:flex-end}
.r{display:flex;flex-direction:column;align-items:center;gap:8px}
.b{width:84px;height:84px;background:var(--color-cream);border:1px solid var(--border)}
.tk{font-family:var(--font-body);font-size:11px;color:var(--fg-subtle);letter-spacing:.04em}
.px{font-family:var(--font-mono);font-size:10px;color:var(--fg-muted)}
</style></head><body>
<div class="row">
  <div class="r"><div class="b" style="border-radius:4px"></div><div class="tk">xs</div><div class="px">4px</div></div>
  <div class="r"><div class="b" style="border-radius:8px"></div><div class="tk">sm</div><div class="px">8px</div></div>
  <div class="r"><div class="b" style="border-radius:12px"></div><div class="tk">md</div><div class="px">12px</div></div>
  <div class="r"><div class="b" style="border-radius:20px"></div><div class="tk">lg</div><div class="px">20px</div></div>
  <div class="r"><div class="b" style="border-radius:32px"></div><div class="tk">xl</div><div class="px">32px</div></div>
  <div class="r"><div class="b" style="border-radius:999px;width:140px"></div><div class="tk">pill</div><div class="px">999px</div></div>
</div>
</body></html>
