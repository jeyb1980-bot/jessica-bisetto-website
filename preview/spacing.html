<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing Scale" subtitle="4-px base, sp-1 → sp-10" viewport="700x220" --><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:28px 32px;background:var(--bg)}
.scale{display:flex;align-items:flex-end;gap:12px}
.s{display:flex;flex-direction:column;align-items:center;gap:6px}
.b{background:var(--color-teal-100);border-radius:4px}
.tk{font-family:var(--font-body);font-size:10px;letter-spacing:.04em;color:var(--fg-subtle)}
.px{font-family:var(--font-mono);font-size:10px;color:var(--fg-muted)}
</style></head><body>
<div class="scale">
  <div class="s"><div class="b" style="width:18px;height:4px"></div><div class="tk">sp-1</div><div class="px">4</div></div>
  <div class="s"><div class="b" style="width:18px;height:8px"></div><div class="tk">sp-2</div><div class="px">8</div></div>
  <div class="s"><div class="b" style="width:18px;height:12px"></div><div class="tk">sp-3</div><div class="px">12</div></div>
  <div class="s"><div class="b" style="width:18px;height:16px"></div><div class="tk">sp-4</div><div class="px">16</div></div>
  <div class="s"><div class="b" style="width:18px;height:24px"></div><div class="tk">sp-5</div><div class="px">24</div></div>
  <div class="s"><div class="b" style="width:18px;height:32px"></div><div class="tk">sp-6</div><div class="px">32</div></div>
  <div class="s"><div class="b" style="width:18px;height:48px"></div><div class="tk">sp-7</div><div class="px">48</div></div>
  <div class="s"><div class="b" style="width:18px;height:64px"></div><div class="tk">sp-8</div><div class="px">64</div></div>
  <div class="s"><div class="b" style="width:18px;height:96px"></div><div class="tk">sp-9</div><div class="px">96</div></div>
  <div class="s"><div class="b" style="width:18px;height:128px"></div><div class="tk">sp-10</div><div class="px">128</div></div>
</div>
</body></html>
