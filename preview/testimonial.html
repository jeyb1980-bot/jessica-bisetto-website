<!doctype html>
<!-- @dsCard group="Components" name="Testimonial" subtitle="German quote treatment" viewport="700x220" --><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:28px 32px;background:var(--bg)}
.tw{max-width:620px;background:var(--bg-raised);border-radius:var(--r-lg);padding:28px 32px 24px;box-shadow:var(--shadow-sm);position:relative}
.q{font-family:var(--font-display);font-style:italic;font-weight:300;font-size:20px;line-height:1.55;color:var(--fg);text-wrap:pretty}
.q::before{content:"„";font-size:48px;color:var(--color-clay-300);position:absolute;top:-2px;left:14px;font-family:var(--font-display)}
.sig{display:flex;align-items:center;gap:12px;margin-top:18px}
.av{width:36px;height:36px;border-radius:50%;background:#E4D9C6 url('../assets/portrait.jpg') center/cover}
.who{font-family:var(--font-body);font-size:13px}
.who b{display:block;color:var(--fg);font-weight:600}
.who span{color:var(--fg-subtle);font-size:12px}
</style></head><body>
<div class="tw">
  <div class="q" style="margin-left:36px">Seit dem Coaching geht es mir endlich wieder gut. Sie haben mir mit ganz viel Empathie und wirksamen Methoden geholfen.</div>
  <div class="sig" style="margin-left:36px"><div class="av"></div><div class="who"><b>Nadine S.</b><span>Kundin · 2023</span></div></div>
</div>
</body></html>
